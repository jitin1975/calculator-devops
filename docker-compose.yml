services:
  calculator:
    image: jitin1975/calculator-devops:latest
    container_name: calculator
    environment:
      - SERVER_PORT=8080
    networks:
      - calcnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  proxy:
    image: nginx:alpine
    container_name: calculator-proxy
    ports:
      - "80:80"
    depends_on:
      calculator:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calcnet
    restart: unless-stopped

networks:
  calcnet:
    driver: bridge
